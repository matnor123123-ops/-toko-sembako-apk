name: Build APK Toko Sembako

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.2.0

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'toko_sembako_apk_build*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR=$(dirname "$(find project -name buildozer.spec -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Collect APK
        run: |
          mkdir -p apk
          find project -type f -name "*.apk" -exec cp {} apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: apk/*.apk
          retention-days: 7
