name: Build APK Toko Sembako

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "setuptools<70" \
            wheel \
            "cython<3" \
            buildozer==1.5.0

      - name: Find project
        run: |
          echo "Isi repository:"
          find . -maxdepth 3 -type f | sort

      - name: Find buildozer.spec
        run: |
          SPEC=$(find . -name buildozer.spec -type f | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "buildozer.spec tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan di:"
          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug

      - name: Find APK
        run: |
          echo "Mencari APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: |
            ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 7
