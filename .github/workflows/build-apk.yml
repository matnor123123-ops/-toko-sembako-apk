name: Build APK Toko Sembako

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext \
            libltdl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Check Buildozer
        run: |
          python --version
          cython --version
          buildozer --version

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'toko_sembako_apk_build*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File toko_sembako_apk_build*.zip tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(dirname "$(find project -name buildozer.spec -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: buildozer.spec tidak ditemukan."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project
        run: |
          cd "$PROJECT_DIR"

          echo "Isi project:"
          ls -la

          echo ""
          echo "Buildozer spec:"
          test -f buildozer.spec

          echo ""
          echo "Main Python:"
          test -f main.py

      - name: Accept Android SDK license
        run: |
          echo "ANDROID SDK license akan diterima oleh Buildozer/p4a saat diperlukan."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_NO_TERMINAL: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          cd "$PROJECT_DIR"

          buildozer android debug

      - name: Find APK
        run: |
          echo "Mencari APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan: $APK_FILE"

          mkdir -p apk
          cp "$APK_FILE" apk/toko-sembako-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: apk/toko-sembako-debug.apk
          retention-days: 7
