name: Build Toko Sembako APK

on:
  workflow_dispatch:
  push:
    branches: [ utama ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q toko_sembako_apk_build_ready.zip -d buildsrc
          cp -R buildsrc/. .

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 7
